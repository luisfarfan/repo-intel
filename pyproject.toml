[project]
name = "repo-intelligence-cli"
version = "0.1.0"
description = "SDD-only engineering knowledge ingestion platform for multirepo AI-native projects."
requires-python = ">=3.12"
dependencies = [
  "chromadb>=0.5.23",
  # A hard dependency, not an extra. The MCP server is the daily interface to this
  # index; as an extra, a routine `uv sync` uninstalls fastmcp and the server stops
  # starting with ModuleNotFoundError. The starlette/uvicorn weight is negligible next
  # to chromadb and llama-index, which are already required.
  "fastmcp>=2.0",
  "gitpython>=3.1.43",
  "llama-index>=0.12.0",
  "llama-index-embeddings-ollama>=0.5.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "rich>=13.9.4",
  "sqlalchemy>=2.0.36",
  "typer>=0.15.1",
  "watchdog>=6.0.0",
]

[project.optional-dependencies]
notebooklm = [
  "notebooklm-py[browser]>=0.4.1",
]
# Kept as an empty alias so existing `uv sync --extra mcp` invocations and docs keep
# working; fastmcp itself moved into the required dependency set above.
mcp = []

[project.scripts]
repo-intel = "repo_intel.cli.main:main"
repo-intel-mcp = "repo_intel.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must never reach Ollama or cliproxy; network clients are stubbed. A strict
# xfail turns a fixed defect into a failure, so the marker gets removed with the fix.
# Strict by default, matching that comment: a silently-passing xfail is a fix nobody
# noticed, and the marker rots into a lie about what the code does.
xfail_strict = true
filterwarnings = [
  "ignore::DeprecationWarning:chromadb.*",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["repo_intel"]

[tool.ruff]
line-length = 100
