[project]
name = "repo-intelligence-cli"
version = "0.1.0"
description = "SDD-only engineering knowledge ingestion platform for multirepo AI-native projects."
requires-python = ">=3.12"
dependencies = [
  "chromadb>=0.5.23",
  "gitpython>=3.1.43",
  "llama-index>=0.12.0",
  "llama-index-embeddings-ollama>=0.5.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "rich>=13.9.4",
  "sqlalchemy>=2.0.36",
  "typer>=0.15.1",
  "watchdog>=6.0.0",
]

[project.scripts]
repo-intel = "repo_intel.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "ruff>=0.8.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["repo_intel"]

[tool.ruff]
line-length = 100
